{%- comment -%}
  Usage in an article:
  {% include figure.html src="/assets/img/posts/slug/file.png" alt="What the image shows" caption="Caption, *Markdown* allowed." credit="Source: ..." wide=true %}
{%- endcomment -%}
<figure class="figure{% if include.wide %} figure-wide{% endif %}">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
  {%- if include.caption or include.credit %}
  <figcaption>
    {%- if include.caption %}{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}{% endif -%}
    {%- if include.credit %} <span class="credit">{{ include.credit }}</span>{% endif -%}
  </figcaption>
  {%- endif %}
</figure>
